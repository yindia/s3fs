version: '3.1'

services:
  datanode1:
    command: ["serve", "datanode", "-d", "./data/test1" , "-p", "8080", "-u", "127.0.0.1"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - task-network

  datanode2:  # New datanode
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    networks:
      - task-network
    command: ["serve", "datanode", "-d", "./data/test2" , "-p", "8080", "-u", "127.0.0.1"]

  datanode3:  # New datanode
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    networks:
      - task-network
    command: ["serve", "datanode", "-d", "./data/test3" , "-p", "8080", "-u", "127.0.0.1"]

  datanode4:  # New datanode
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    networks:
      - task-network
    command: ["serve", "datanode", "-d", "./data/test4" , "-p", "8080", "-u", "127.0.0.1"]

  datanode5:  # New datanode
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    networks:
      - task-network
    command: ["serve", "datanode", "-d", "./data/test5" , "-p", "8080", "-u", "127.0.0.1"]

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    command: ["serve", "s3fs", "-n", "datanode1:8081" ,"-n", "datanode1:8082" ,"-n", "datanode1:8083" ,"-n", "datanode1:8084" ,"-n", "datanode1:8085" , "-p", "8080", "-b", "1000", "-r", "3"]
    depends_on:
      datanode1:
        condition: service_healthy
      datanode2:  # Dependency on new datanodes
        condition: service_healthy
      datanode3:  # Dependency on new datanodes
        condition: service_healthy
      datanode4:  # Dependency on new datanodes
        condition: service_healthy
      datanode5:  # Dependency on new datanodes
        condition: service_healthy
    links:
      - datanode1
      - datanode2  # Links to new datanodes
      - datanode3  # Links to new datanodes
      - datanode4  # Links to new datanodes
      - datanode5  # Links to new datanodes
    networks:
      - task-network

networks:
  task-network:
    driver: bridge