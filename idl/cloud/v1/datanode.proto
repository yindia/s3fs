syntax = "proto3";

package cloud.v1;

import "validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service DataNodeService {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc PutData(DataNodePutRequest) returns (DataNodeWriteStatus);
    rpc GetData(DataNodeGetRequest) returns (DataNodeData);
    rpc DeleteData(DataNodeDeleteRequest) returns (DataNodeDeleteStatus);
}


message DataNodeDeleteRequest {
    string block_id = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
    repeated NodeAddress replication_nodes = 2;
}

message DataNodeDeleteStatus {
    bool status = 1;
}

message DataNodeData {
    string data = 1;
}

message DataNodePutRequest {
    string block_id = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
    string data = 2 [(validate.rules).string = {min_len: 1, max_len: 1000}];
    repeated NodeAddress replication_nodes = 3;
}

message DataNodeWriteStatus {
    bool status = 1;
}

message DataNodeGetRequest {
    string block_id = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
}


message NodeAddress {
    string host = 1 [(validate.rules).string = {min_len: 1, max_len: 100, pattern: "^(?!-)[A-Za-z0-9-]{1,63}(?<!-)$"}];
    uint32 service_port = 2 [(validate.rules).string = {min_len: 1, max_len: 5, pattern: "^[0-9]{1,5}$"}];
}

message PingRequest {
    string host = 1 [(validate.rules).string = {min_len: 1, max_len: 100, pattern: "^(?!-)[A-Za-z0-9-]{1,63}(?<!-)$"}];
    uint32 port = 2 [(validate.rules).string = {min_len: 1, max_len: 5, pattern: "^[0-9]{1,5}$"}];
}

message PingResponse {
    bool ack = 1;
}

message HeartbeatRequest {
}

message HeartbeatResponse {
    string status = 1;
}